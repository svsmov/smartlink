<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to the app store...</title>
  <script>
    window.onload = function () {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      if (/android/i.test(userAgent)) {
        window.location.href = "https://play.google.com/store/apps/details?id=com.biginfive.urbanlore&pcampaignid=web_share"; // ← 안드로이드 앱 링크
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.href = "https://apps.apple.com/us/app/urban-lore-the-beat-district/id6747655392"; // ← iOS 앱 링크
      } else {
        window.location.href = "https://play.google.com/store/apps/details?id=com.biginfive.urbanlore&pcampaignid=web_share"; // PC 등
      }
    };
  </script>
</head>
<body>
  <p>Redirecting to the app store...</p>
</body>
</html>
